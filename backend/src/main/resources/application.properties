# APPLICATION
spring.application.name=backend
# port de l'equipe 
server.port=8082  
# BASE DE DONN\u00c9ES MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestionstock?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Utiliser MySQL8Dialect si MySQL 8 est install\u00e9, sinon MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.java.gestion_stock=DEBUG
# D\u00e9sactive Spring Session JDBC pour \u00e9viter les erreurs li\u00e9es aux tables SPRING_SESSION
spring.session.store-type=none
